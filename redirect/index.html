<!doctype html>
<!-- 옛 주소(tteum-events)를 새 주소로 보내는 안내 페이지. 저장소 이름을 1234로 바꾼 뒤,
     tteum-events라는 새 공개 저장소를 만들어 이 파일만 올리고 Pages를 켜면 된다 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>티끌모아 티끌</title>
<meta http-equiv="refresh" content="0; url=https://changheo123.github.io/1234/">
<link rel="canonical" href="https://changheo123.github.io/1234/">
<style>
  :root { --bg: #f3f6f4; --fg: #14211b; --link: #0e7a55; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1512; --fg: #e8f0ec; --link: #5ed3a3; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; padding: 16px; text-align: center; }
  a { color: var(--link); font-weight: 700; }
</style>
<script>location.replace("https://changheo123.github.io/1234/" + location.hash);</script>
</head>
<body>
<p>사이트 주소가 바뀌었어요.<br><a href="https://changheo123.github.io/1234/">새 주소로 이동하기</a></p>
</body>
</html>
